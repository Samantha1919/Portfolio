      <section>
    <h1>Tic Tac Toe</h1>
    <div class="board" id="board"></div>
    <div id="status">Tour de X</div>
    <button onclick="resetGame()">Rejouer</button>
    </section>
    </body>
        </html>
    <script>
      const board = document.getElementById("board");
      const statusText = document.getElementById("status");
      let currentPlayer = "X";
      let gameActive = true;
      let cells = ["", "", "", "", "", "", "", "", ""];

      function createBoard() {
        board.innerHTML = "";
        for (let i = 0; i < 9; i++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          cell.dataset.index = i;
          cell.addEventListener("click", handleClick);
          board.appendChild(cell);
        }
      }

      function handleClick(e) {
        const index = e.target.dataset.index;
        if (cells[index] !== "" || !gameActive) return;
        cells[index] = currentPlayer;
        e.target.textContent = currentPlayer;
        e.target.classList.add("taken");

        if (checkWin()) {
          statusText.textContent = `Le joueur ${currentPlayer} a gagné !`;
          gameActive = false;
        } else if (!cells.includes("")) {
          statusText.textContent = "Match nul !";
          gameActive = false;
        } else {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
          statusText.textContent = `Tour de ${currentPlayer}`;
        }
      }

      function checkWin() {
        const winPatterns = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8], // lignes
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8], // colonnes
          [0, 4, 8],
          [2, 4, 6], // diagonales
        ];
        return winPatterns.some((pattern) => {
          return pattern.every((index) => cells[index] === currentPlayer);
        });
      }

      function resetGame() {
        currentPlayer = "X";
        gameActive = true;
        cells = ["", "", "", "", "", "", "", "", ""];
        statusText.textContent = "Tour de X";
        createBoard();
      }

      createBoard();
    </script>
  </body>
</html>
